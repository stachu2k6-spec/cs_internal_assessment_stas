<!-- NEXT MEETING CARD AND QUICK SCHEDULE DIALOG -->
<div class="card">
    <!-- Next Meeting Information Panel -->
    <div class="font-semibold text-xl mb-4">Next meeting</div>
    <p-panel header="Info" [toggleable]="true">
        <p class="m-0">
            <!-- Displays patient information dynamically using Angular interpolation -->
            Patient: {{ nextMeeting.patient.name }} {{ nextMeeting.patient.surname }}
        </p>
        <p class="m-0">
            <!-- Angular date pipe formats meeting date -->
            Meeting Date: {{ nextMeeting.dateTime | date:'yyyy-MM-dd' }}
        </p>
        <p class="m-0">
            <!-- Angular date pipe formats meeting time -->
            Meeting Time: {{ nextMeeting.dateTime | date:'HH:mm' }}
        </p>
    </p-panel>

    <p-dialog header="Quick Schedule" [(visible)]="isQuickScheduleVisible"  [modal]="true">

        <!-- Form content -->
        <div class="flex items-center justify-center">
            <div class="card flex flex-row gap-4">
                <div class="card flex flex-col gap-4">
                    <div class="font-semibold text-xl flex items-center justify-center">Meeting Info</div>
                    <div class="flex flex-col gap-2">
                        <label for="name1">Patient Name</label>
                        <p-autoComplete
                            [(ngModel)]="patient.name"
                            [suggestions]="filteredPatientNames"
                            placeholder="Search name"
                            (completeMethod)="filterNames($event)"
                            (onSelect)="onNameSelected()"
                        ></p-autoComplete>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="name1">Patient Surname</label>
                        <p-autoComplete
                            [(ngModel)]="patient.surname"
                            [suggestions]="filteredPatientSurnames"
                            placeholder="Search surname"
                            (completeMethod)="filterSurnames($event)"
                        ></p-autoComplete>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label>Date</label>
                        <p-datepicker
                            [(ngModel)]="meeting.dateTime"
                            [disabled]="true"
                            [showIcon]="true"
                            [showButtonBar]="true"
                            dateFormat="yy MM dd"
                            inputId="datePicker">
                        </p-datepicker>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="surname1">Time</label>
                        <p-datepicker inputId="calendar-timeonly" [(ngModel)]="meeting.dateTime" [timeOnly]="true" ></p-datepicker>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="email1">Minutes</label>
                        <p-inputnumber [(ngModel)]="meeting.duration" showButtons mode="decimal"></p-inputnumber>
                    </div>

                </div>
                <div class="card flex flex-col gap-4">
                    <div class="col flex items-center justify-center font-semibold text-xl">Notes</div>
                    <textarea
                        pTextarea placeholder="Meeting notes here..."
                        [autoResize]="true"
                        rows="25"
                        cols="30"
                        [(ngModel)]="meeting.notes"
                    ></textarea>
                </div>
            </div>


        </div>

        <ng-template #footer>
            <p-button
                label="Save"
                icon="pi pi-save"
                raised
                (click)="saveMeeting()"
            ></p-button>
            <p-button
                label="Cancel"
                icon="pi pi-times"
                severity="warn"
                raised
                (click)="cancelScheduling()"
            ></p-button>
        </ng-template>
    </p-dialog>
</div>



<ng-container *ngIf="showCalendar">
    <full-calendar #calendar [options]="calendarOptions" [events]="events"></full-calendar>
</ng-container>
